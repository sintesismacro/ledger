[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sintesis-ledger"
version = "0.1.0"
description = "SINTESIS Forward Evidence Ledger: validation, scoring, rendering and qualified timestamps"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "FREDY SOLANO", email = "office@sintesismacro.com" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8"]

[tool.setuptools]
packages = ["ledger"]

[tool.setuptools.package-data]
ledger = ["fonts/*.woff2", "fonts/OFL-*.txt"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]   # asserts in tests; git/openssl subprocess calls are fixed argv

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
