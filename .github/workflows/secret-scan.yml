name: Secret scan

# Scans every push and pull request for committed credentials (API keys, tokens,
# private keys, broker configuration). GitHub's own secret scanning only covers
# public repositories on the free plan; this job covers private ones too.
# Runs the pinned gitleaks release binary directly: no licence key, no container.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly full-history sweep, Monday 03:17 UTC

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan full git history
        run: /tmp/gitleaks git --redact --exit-code 1 .
