config:
  default: true
  MD013: false      # line length: prose wraps freely
  MD033: false      # inline HTML: <sub> footers and <!-- notes --> are used
  MD041: false      # first line need not be a top-level heading (front matter)
  MD024:
    siblings_only: true
ignores:
  - node_modules/**
  - .venv/**
  - "**/CHANGELOG.md"
